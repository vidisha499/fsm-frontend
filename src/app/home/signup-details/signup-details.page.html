<ion-content [fullscreen]="true" class="premium-wrapper">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="hero-header">
    <div class="header-overlay"></div>
    <div class="header-content">
      <div class="nav-bar">
        <div class="left-section">
          <button (click)="navToLogin()" class="glass-btn">
            <i class="fas fa-chevron-left"></i>
          </button>
          <h1>Ranger <span>Registration</span></h1>
        </div>
      </div>
    </div>
  </div>

  <div class="card-container">
    <div class="main-card">
      
      <div class="scanner-section">
        <div class="camera-frame" (click)="captureImage()">
          <div class="corners-bold">
            <span class="t-l"></span><span class="t-r"></span>
            <span class="b-l"></span><span class="b-r"></span>
          </div>
          <div class="scanner-inner" [style.background-image]="profileImage ? 'url(' + profileImage + ')' : ''">
            <div class="scan-line" *ngIf="!profileImage"></div>
            <div *ngIf="!profileImage" class="placeholder-content">
              <i class="fas fa-camera main-cam-icon"></i>
              <span class="cam-text">ADD PHOTO</span>
            </div>
          </div>
        </div>
      </div>

      <div class="form-grid">
        <div class="input-row">
          <div class="input-pill half">
            <label>FIRST NAME</label>
            <div class="pill-content">
              <input [(ngModel)]="firstName" type="text" placeholder="First Name">
            </div>
          </div>
          <div class="input-pill half">
            <label>SURNAME</label>
            <div class="pill-content">
              <input [(ngModel)]="lastName" type="text" placeholder="Surname">
            </div>
          </div>
        </div>

        <div class="input-pill">
          <label>MOBILE NUMBER</label>
          <div class="pill-content">
            <i class="fas fa-phone-alt"></i>
            <input [(ngModel)]="mobile" type="text" readonly class="readonly">
          </div>
        </div>

        <div class="input-pill">
          <label>GENDER*</label>
          <div class="pill-content">
            <i class="fas fa-venus-mars"></i>
            <select [(ngModel)]="gender" style="border: none; background: transparent; width: 100%; font-weight: 700; color: var(--dark-slate); outline: none; font-size: 14px;">
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="input-pill">
          <label>RESIDENTIAL ADDRESS*</label>
          <div class="pill-content">
            <i class="fas fa-home"></i>
            <textarea [(ngModel)]="address" placeholder="Residential Address" style="border: none; background: transparent; width: 100%; font-weight: 700; color: var(--dark-slate); outline: none; font-size: 14px; min-height: 60px;"></textarea>
          </div>
        </div>

        <div class="section-divider">
          <span>ASSIGNMENT</span>
        </div>

        <div class="input-pill">
          <label>CLIENT / RANGE*</label>
          <div class="pill-content">
            <i class="fas fa-map-marked-alt"></i>
            <select [(ngModel)]="range" (change)="onRangeChange()" style="border: none; background: transparent; width: 100%; font-weight: 700; color: var(--dark-slate); outline: none; font-size: 14px;">
              <option value="">Select Range</option>
              <option *ngFor="let r of ranges" [value]="r.name || r">{{ r.name || r }}</option>
            </select>
          </div>
        </div>

        <div class="input-pill">
          <label>SITE / BEAT*</label>
          <div class="pill-content">
            <i class="fas fa-draw-polygon"></i>
            <select [(ngModel)]="beat" style="border: none; background: transparent; width: 100%; font-weight: 700; color: var(--dark-slate); outline: none; font-size: 14px;">
              <option value="">Select Beat</option>
              <option *ngFor="let b of filteredBeats" [value]="b.name">{{ b.name }}</option>
            </select>
          </div>
        </div>

        <div class="input-pill">
          <label>SHIFT*</label>
          <div class="pill-content">
            <i class="fas fa-clock"></i>
            <select [(ngModel)]="shift" style="border: none; background: transparent; width: 100%; font-weight: 700; color: var(--dark-slate); outline: none; font-size: 14px;">
              <option value="">Select Shift</option>
              <option value="General shift (12:00 am - 11:57 pm)">General shift (12:00 am - 11:57 pm)</option>
              <option value="Morning shift (06:00 am - 02:00 pm)">Morning shift (06:00 am - 02:00 pm)</option>
              <option value="Afternoon shift (02:00 pm - 10:00 pm)">Afternoon shift (02:00 pm - 10:00 pm)</option>
              <option value="Night shift (10:00 pm - 06:00 am)">Night shift (10:00 pm - 06:00 am)</option>
            </select>
          </div>
        </div>

        <div class="input-pill">
          <label>WEEKLY OFF*</label>
          <div class="pill-content">
            <i class="fas fa-calendar-day"></i>
            <select [(ngModel)]="weeklyOff" style="border: none; background: transparent; width: 100%; font-weight: 700; color: var(--dark-slate); outline: none; font-size: 14px;">
              <option value="">Select Weekly Off</option>
              <option value="Sunday">Sunday</option>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
            </select>
          </div>
        </div>

        <div class="section-divider">
          <span>SECURITY</span>
        </div>

        <div class="input-pill">
          <label>DATE OF BIRTH</label>
          <div class="pill-content">
            <i class="fas fa-calendar-alt"></i>
            <input [(ngModel)]="dob" type="date">
          </div>
        </div>

        <div class="input-pill">
          <label>EMAIL ID</label>
          <div class="pill-content">
            <i class="fas fa-envelope"></i>
            <input [(ngModel)]="email" type="email" placeholder="email@example.com">
          </div>
        </div>

        <div class="input-pill">
          <label>NEW PASSWORD</label>
          <div class="pill-content">
            <i class="fas fa-lock"></i>
            <input [type]="passwordType" [(ngModel)]="password" placeholder="••••••••">
            <ion-icon [name]="passwordIcon" (click)="togglePassword('pw')" class="toggle-eye"></ion-icon>
          </div>
        </div>

        <div class="input-pill">
          <label>CONFIRM PASSWORD</label>
          <div class="pill-content">
            <i class="fas fa-shield-alt"></i>
            <input [type]="confirmPasswordType" [(ngModel)]="confirmPassword" placeholder="••••••••">
            <ion-icon [name]="confirmPasswordIcon" (click)="togglePassword('cpw')" class="toggle-eye"></ion-icon>
          </div>
        </div>

        <button class="mark-btn" (click)="onSignup()">
          <span class="btn-text">SIGNUP NOW</span>
          <div class="btn-check">
            <i class="fas fa-chevron-right"></i>
          </div>
        </button>
      </div>
      
      <div class="bottom-spacer"></div>
    </div>
  </div>
</ion-content>
