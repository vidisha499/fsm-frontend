<ion-content [fullscreen]="true" class="premium-wrapper">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="hero-header">
    <div class="header-overlay"></div>
    <div class="header-content">
      <div class="nav-bar">
        <div class="left-section">
          <button (click)="goBack()" class="glass-btn">
            <i class="fas fa-chevron-left"></i>
          </button>
          <h1>Add <span>Approved User</span></h1>
        </div>
      </div>
      <div class="header-subtitle">Pre-register users for automatic verification</div>
    </div>
  </div>

  <div class="card-container">
    <div class="main-card animate__animated animate__fadeInUp">
      
      <div class="form-grid">
        <div class="input-row">
          <div class="input-pill half">
            <label>FIRST NAME</label>
            <div class="pill-content">
              <i class="fas fa-user-edit"></i>
              <input [(ngModel)]="userData.firstName" type="text" placeholder="First Name">
            </div>
          </div>
          <div class="input-pill half">
            <label>SURNAME</label>
            <div class="pill-content">
              <i class="fas fa-id-card"></i>
              <input [(ngModel)]="userData.lastName" type="text" placeholder="Surname">
            </div>
          </div>
        </div>

        <div class="input-pill">
          <label>MOBILE NUMBER (VERIFICATION KEY)</label>
          <div class="pill-content">
            <i class="fas fa-phone-alt"></i>
            <input [(ngModel)]="userData.contact" type="tel" placeholder="Enter 10-digit number" maxlength="10">
          </div>
        </div>

        <div class="input-pill">
          <label>EMAIL ID</label>
          <div class="pill-content">
            <i class="fas fa-envelope"></i>
            <input [(ngModel)]="userData.email" type="email" placeholder="Enter Email Address">
          </div>
        </div>

        <div class="input-pill">
          <label>SELECT ROLE</label>
          <div class="pill-content">
            <i class="fas fa-user-shield"></i>
            <select [(ngModel)]="userData.roleId" (change)="onRoleSelectChange($event)">
              <option [value]="null">Select Role</option>
              
              <!-- Static Roles -->
              <option *ngFor="let role of staticRoles" [value]="role.id">
                {{ role.name }} (ID: {{ role.id }})
              </option>

              <!-- Special Dynamic Option at the end -->
              <option value="dynamic_selection">-- Dynamic (Custom Role) --</option>
            </select>
          </div>
        </div>

        <!-- Secondary Dropdown for Dynamic Roles (Only shows if Dynamic is selected above) -->
        <div class="input-pill animate__animated animate__fadeIn" *ngIf="isDynamicSelected">
          <label>CHOOSE DYNAMIC ROLE</label>
          <div class="pill-content">
            <i class="fas fa-id-badge"></i>
            <select [(ngModel)]="userData.dynamicRoleId" (change)="userData.roleId = userData.dynamicRoleId">
              <option [value]="null">Select Custom Role</option>
              <option *ngFor="let role of dynamicRoles" [value]="role.id">
                {{ role.name }} (ID: {{ role.id }})
              </option>
            </select>
          </div>
        </div>

        <ng-container *ngIf="shouldShowHierarchy()">
          <ng-container *ngFor="let layer of layers; let i = index">

            <!-- Dropdown: show only if shouldShowLayer returns true -->
            <div class="input-pill" *ngIf="shouldShowLayer(i)">
              <label>{{ layer.name | uppercase }}</label>
              <div class="pill-content">
                <i class="fas fa-sitemap"></i>
                <select [(ngModel)]="hierarchySelections[i]" (change)="onLayerChange(i)">
                  <option [value]="null">Select {{ layer.name }}</option>
                  <option *ngFor="let ent of layerEntities[layer.id]" [value]="ent.id">
                    {{ ent.name }}
                  </option>
                </select>
              </div>
            </div>

            <!-- Checkbox: show only after value selected AND not last layer -->
            <div class="stop-here-row"
                 *ngIf="shouldShowLayer(i) && hierarchySelections[i] && i < layers.length - 1">
              <label class="stop-here-label">
                <input type="checkbox"
                       [(ngModel)]="stopHereFlags[i]"
                       (change)="onStopHereChange(i)">
                <span>Assign at <b>{{ layer.name }}</b> level only</span>
              </label>
            </div>

          </ng-container>
        </ng-container>

        <button class="mark-btn" (click)="saveUser()" [disabled]="isSaving">
          <span class="btn-text">{{ isSaving ? 'SAVING...' : 'REGISTER USER' }}</span>
          <div class="btn-check">
            <i class="fas" [class.fa-spinner]="isSaving" [class.fa-fa-spin]="isSaving" [class.fa-check]="!isSaving"></i>
          </div>
        </button>
      </div>
      
      <div class="bottom-spacer"></div>
    </div>
  </div>
</ion-content>
