<ion-content [fullscreen]="true" class="premium-wrapper">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="hero-header">
    <div class="header-overlay"></div>
    <div class="header-content">
      <div class="nav-bar">
        <div class="left-section">
          <button (click)="goBack()" class="glass-btn">
            <i class="fas fa-chevron-left"></i>
          </button>
          <h1>Add <span>Approved User</span></h1>
        </div>
      </div>
      <div class="header-subtitle">Pre-register users for automatic verification</div>
    </div>
  </div>

  <div class="card-container">
    <div class="main-card animate__animated animate__fadeInUp">
      
      <div class="form-grid">
        <div class="input-row">
          <div class="input-pill half">
            <label>FIRST NAME</label>
            <div class="pill-content">
              <i class="fas fa-user-edit"></i>
              <input [(ngModel)]="userData.firstName" type="text" placeholder="First Name">
            </div>
          </div>
          <div class="input-pill half">
            <label>SURNAME</label>
            <div class="pill-content">
              <i class="fas fa-id-card"></i>
              <input [(ngModel)]="userData.lastName" type="text" placeholder="Surname">
            </div>
          </div>
        </div>

        <div class="input-pill">
          <label>MOBILE NUMBER (VERIFICATION KEY)</label>
          <div class="pill-content">
            <i class="fas fa-phone-alt"></i>
            <input [(ngModel)]="userData.contact" type="tel" placeholder="Enter 10-digit number" maxlength="10">
          </div>
        </div>

        <div class="input-pill">
          <label>ASSIGN ROLE</label>
          <div class="pill-content">
            <i class="fas fa-user-shield"></i>
            <select [(ngModel)]="userData.roleId">
              <option [value]="null">Select Role</option>
              <option *ngFor="let role of roles" [value]="role.id">{{ role.name }}</option>
            </select>
          </div>
        </div>

        <div class="input-pill">
          <label>ASSIGN RANGE</label>
          <div class="pill-content">
            <i class="fas fa-map-marked-alt"></i>
            <select [(ngModel)]="userData.range" (change)="onRangeChange()">
              <option [value]="null">Select Range</option>
              <option *ngFor="let r of ranges" [value]="r">{{ r }}</option>
            </select>
          </div>
        </div>

        <div class="input-pill">
          <label>ASSIGN BEAT</label>
          <div class="pill-content">
            <i class="fas fa-draw-polygon"></i>
            <select [(ngModel)]="userData.beat">
              <option [value]="null">Select Beat</option>
              <option *ngFor="let b of filteredBeats" [value]="b.name">{{ b.name }}</option>
            </select>
          </div>
        </div>

        <button class="mark-btn" (click)="saveUser()" [disabled]="isSaving">
          <span class="btn-text">{{ isSaving ? 'SAVING...' : 'REGISTER USER' }}</span>
          <div class="btn-check">
            <i class="fas" [class.fa-spinner]="isSaving" [class.fa-fa-spin]="isSaving" [class.fa-check]="!isSaving"></i>
          </div>
        </button>
      </div>
      
      <div class="bottom-spacer"></div>
    </div>
  </div>
</ion-content>
