<ion-content [fullscreen]="true" class="premium-wrapper">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="hero-header">
    <div class="header-overlay"></div>
    <div class="header-content">
      <div class="nav-bar">
        <div class="left-section">
          <button (click)="goBack()" class="glass-btn">
            <i class="fas fa-chevron-left"></i>
          </button>
          <h1>Add <span>Approved User</span></h1>
        </div>
      </div>
      <div class="header-subtitle">Pre-register users for automatic verification</div>
    </div>
  </div>

  <div class="card-container">
    <div class="main-card animate__animated animate__fadeInUp">
      
      <div class="form-grid">
        <div class="input-row">
          <div class="input-pill half">
            <label>FIRST NAME</label>
            <div class="pill-content">
              <i class="fas fa-user-edit"></i>
              <input [(ngModel)]="userData.firstName" type="text" placeholder="First Name">
            </div>
          </div>
          <div class="input-pill half">
            <label>SURNAME</label>
            <div class="pill-content">
              <i class="fas fa-id-card"></i>
              <input [(ngModel)]="userData.lastName" type="text" placeholder="Surname">
            </div>
          </div>
        </div>

        <div class="input-pill">
          <label>MOBILE NUMBER (VERIFICATION KEY)</label>
          <div class="pill-content">
            <i class="fas fa-phone-alt"></i>
            <input [(ngModel)]="userData.contact" type="tel" placeholder="Enter 10-digit number" maxlength="10">
          </div>
        </div>

        <div class="input-pill">
          <label>EMAIL ID</label>
          <div class="pill-content">
            <i class="fas fa-envelope"></i>
            <input [(ngModel)]="userData.email" type="email" placeholder="Enter Email Address">
          </div>
        </div>

        <div class="input-pill">
          <label>ROLE CATEGORY</label>
          <div class="pill-content">
            <i class="fas fa-layer-group"></i>
            <select [(ngModel)]="userData.roleCategory" (change)="userData.roleId = null">
              <option value="static">Static (Standard Roles)</option>
              <option value="dynamic">Dynamic (Custom Roles)</option>
            </select>
          </div>
        </div>

        <div class="input-pill">
          <label>SELECT ROLE</label>
          <div class="pill-content">
            <i class="fas fa-user-shield"></i>
            <select [(ngModel)]="userData.roleId">
              <option [value]="null">Select Role</option>
              
              <!-- Shows Static Roles if category is static -->
              <ng-container *ngIf="userData.roleCategory === 'static'">
                <option *ngFor="let role of staticRoles" [value]="role.id">
                  {{ role.name }} (ID: {{ role.id }})
                </option>
              </ng-container>

              <!-- Shows Dynamic Roles if category is dynamic -->
              <ng-container *ngIf="userData.roleCategory === 'dynamic'">
                <option *ngFor="let role of dynamicRoles" [value]="role.id">
                  {{ role.name }} (ID: {{ role.id }})
                </option>
              </ng-container>
            </select>
          </div>
        </div>

        <ng-container *ngIf="shouldShowHierarchy()">
          <div class="input-pill">
            <label>DEPARTMENT (RANGE)</label>
            <div class="pill-content">
              <i class="fas fa-building"></i>
              <select [(ngModel)]="userData.range" (change)="onRangeChange()">
                <option [value]="null">Select Department</option>
                <option *ngFor="let r of ranges" [value]="r">{{ r }}</option>
              </select>
            </div>
          </div>

          <div class="input-pill" style="position: relative;">
            <label>DESIGNATION (BEAT)</label>
            <div class="pill-content">
              <i class="fas fa-briefcase"></i>
              <input [(ngModel)]="userData.beat" 
                     type="text" 
                     placeholder="Search Beat or Type Designation"
                     (focus)="showBeatSuggestions = true"
                     (blur)="hideSuggestionsWithDelay()">
              
              <!-- Custom Premium Suggestion List -->
              <div class="custom-suggestion-list" *ngIf="showBeatSuggestions && filteredBeats.length > 0">
                <div class="suggestion-item" 
                     *ngFor="let b of filteredBeats" 
                     (mousedown)="selectBeat(b.name)">
                  <i class="fas fa-map-marker-alt"></i>
                  <span>{{ b.name }}</span>
                </div>
              </div>
            </div>
          </div>
        </ng-container>

        <button class="mark-btn" (click)="saveUser()" [disabled]="isSaving">
          <span class="btn-text">{{ isSaving ? 'SAVING...' : 'REGISTER USER' }}</span>
          <div class="btn-check">
            <i class="fas" [class.fa-spinner]="isSaving" [class.fa-fa-spin]="isSaving" [class.fa-check]="!isSaving"></i>
          </div>
        </button>
      </div>
      
      <div class="bottom-spacer"></div>
    </div>
  </div>
</ion-content>
