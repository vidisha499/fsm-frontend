<ion-content [fullscreen]="true" class="premium-wrapper">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="hero-header">
    <div class="header-overlay"></div>
    <div class="header-content">
      <div class="nav-bar">
        <div class="left-section">
          <button (click)="goBack()" class="glass-btn">
            <i class="fas fa-chevron-left"></i>
          </button>
          <h1>{{ 'ADD_USER_PAGE.TITLE' | translate }} <span>{{ 'ADD_USER_PAGE.TITLE_SPAN' | translate }}</span></h1>
        </div>
      </div>
      <div class="header-subtitle">{{ 'ADD_USER_PAGE.SUBTITLE' | translate }}</div>
    </div>
  </div>

  <div class="card-container">
    <div class="main-card animate__animated animate__fadeInUp">
      
      <div class="form-grid">
        <div class="input-row">
          <div class="input-pill half">
            <label>{{ 'ADD_USER_PAGE.LABEL_FNAME' | translate }}</label>
            <div class="pill-content">
              <i class="fas fa-user-edit"></i>
              <input [(ngModel)]="userData.firstName" type="text" [placeholder]="'ADD_USER_PAGE.PH_FNAME' | translate">
            </div>
          </div>
          <div class="input-pill half">
            <label>{{ 'ADD_USER_PAGE.LABEL_LNAME' | translate }}</label>
            <div class="pill-content">
              <i class="fas fa-id-card"></i>
              <input [(ngModel)]="userData.lastName" type="text" [placeholder]="'ADD_USER_PAGE.PH_LNAME' | translate">
            </div>
          </div>
        </div>

        <div class="input-pill">
          <label>{{ 'ADD_USER_PAGE.LABEL_MOBILE' | translate }}</label>
          <div class="pill-content">
            <i class="fas fa-phone-alt"></i>
            <input [(ngModel)]="userData.contact" type="tel" [placeholder]="'ADD_USER_PAGE.PH_MOBILE' | translate"
              maxlength="10" inputmode="numeric" pattern="[0-9]*"
              (input)="onPhoneInput($event, 'contact')">
          </div>
        </div>

        <div class="input-pill">
          <label>{{ 'ADD_USER_PAGE.LABEL_EMAIL' | translate }}</label>
          <div class="pill-content">
            <i class="fas fa-envelope"></i>
            <input [(ngModel)]="userData.email" type="email" [placeholder]="'ADD_USER_PAGE.PH_EMAIL' | translate">
          </div>
        </div>

        <div class="input-pill">
          <label>{{ 'ADD_USER_PAGE.LABEL_ROLE' | translate }}</label>
          <div class="pill-content">
            <i class="fas fa-user-shield"></i>
            <select [(ngModel)]="userData.roleId" (change)="onRoleSelectChange($event)">
              <option [value]="null">{{ 'ADD_USER_PAGE.PH_ROLE' | translate }}</option>
              
              <!-- Static Roles (Including ID 10) -->
              <option *ngFor="let role of staticRoles" [value]="role.id">
                {{ role.displayName }} (ID: {{ role.id }})
              </option>
            </select>
          </div>
        </div>

        <!-- Secondary Dropdown for Dynamic Roles (Only shows if ID 10 is selected above) -->
        <div class="input-pill animate__animated animate__fadeIn" *ngIf="isDynamicSelected">
          <label>{{ 'ADD_USER_PAGE.LABEL_DYNAMIC_ROLE' | translate }}</label>
          <div class="pill-content">
            <i class="fas fa-id-badge"></i>
            <select [(ngModel)]="userData.dynamicRoleId" (change)="onDynamicRoleChange($event)">
              <option [value]="null">{{ 'ADD_USER_PAGE.PH_DYNAMIC_ROLE' | translate }}</option>
              <option *ngFor="let role of dynamicRoles" [value]="role.id">
                {{ role.displayName }} (ID: {{ role.id }})
              </option>
            </select>
          </div>
        </div>

        <ng-container *ngIf="shouldShowHierarchy()">
          <div *ngFor="let layer of layers; let i = index">
            <!-- Only show this layer's dropdown if shouldShowLayer(i) returns true -->
            <ng-container *ngIf="shouldShowLayer(i)">
              <div class="input-pill animate__animated animate__fadeIn" *ngIf="(layerEntities[layer.id] || []).length > 0">
                <label>{{ layer.name | uppercase }}</label>
                <div class="pill-content">
                  <i class="fas fa-layer-group"></i>
                  <select [(ngModel)]="hierarchySelections[i]" (change)="onLayerChange(i)">
                    <option [value]="null">-- Select {{ layer.name }} --</option>
                    <option *ngFor="let ent of layerEntities[layer.id]" [value]="ent.id">{{ ent.name }}</option>
                  </select>
                </div>
              </div>

              <!-- "Assign at this level only" checkbox — only shown AFTER a selection is made -->
              <div class="stop-here-row" *ngIf="hierarchySelections[i] && hierarchySelections[i] !== 'null' && (i < layers.length - 1)">
                <label class="stop-here-label">
                  <input type="checkbox"
                         [checked]="stopHereFlags[i]"
                         (change)="stopHereFlags[i] = !stopHereFlags[i]; onStopHereChange(i)">
                  <span>Assign at <b>{{ layer.name }}</b> level only</span>
                </label>
              </div>
            </ng-container>
          </div>

          <!-- ➕ Add to Assignments List Button -->
          <button class="add-assignment-btn" (click)="addSelectedAssignment()" *ngIf="getDeepestSelectedEntity()">
            <i class="fas fa-plus-circle"></i>
            <span>Add to Assignments List</span>
          </button>

          <!-- 📋 Selected Assignments List -->
          <div class="assignments-list" *ngIf="selectedAssignments.length > 0">
            <label class="assignments-list-label">
              <i class="fas fa-clipboard-list"></i> Assigned Entities ({{ selectedAssignments.length }})
            </label>
            <div class="assignment-chip" *ngFor="let item of selectedAssignments; let idx = index">
              <div class="chip-info">
                <i class="fas fa-map-marker-alt"></i>
                <span>{{ item.name }} <small>({{ item.layerName }})</small></span>
              </div>
              <button class="chip-remove" (click)="removeSelectedAssignment(idx)">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>
        </ng-container>
        

        <!-- ROLE PERMISSIONS PREVIEW -->
        <div class="perm-preview-section" *ngIf="shouldShowHierarchy() || (userData.roleId && userData.roleId !== 'null' && userData.roleId !== '10')">
          <div class="perm-preview-header">
            <i class="fas fa-key"></i>
            <span>{{ 'ADD_USER_PAGE.PERMISSIONS_TITLE' | translate }}</span>
            <button class="toggle-perms-btn" (click)="showPermEdit = !showPermEdit">
              {{ showPermEdit ? ('ADD_USER_PAGE.HIDE' | translate) : ('ADD_USER_PAGE.EDIT' | translate) }}
            </button>
          </div>

          <div class="perm-edit-grid" *ngIf="showPermEdit">
            <div class="perm-edit-mod" *ngFor="let mod of allPermissions">
              <div class="perm-mod-name">{{ mod.displayName | uppercase }}</div>
              <div class="perm-mod-actions">
                <label class="perm-check" *ngFor="let act of mod.actions">
                  <input type="checkbox" 
                         [checked]="userPermMap[mod.name] && userPermMap[mod.name][act.action]"
                         (change)="togglePerm(mod.name, act.action, $event)">
                  <span>{{ act.action }}</span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <button class="mark-btn" (click)="saveUser()" [disabled]="isSaving">
          <span class="btn-text">{{ isSaving ? ('ADD_USER_PAGE.SAVING' | translate) : ('ADD_USER_PAGE.REGISTER_BTN' | translate) }}</span>
          <div class="btn-check">
            <i class="fas" [class.fa-spinner]="isSaving" [class.fa-fa-spin]="isSaving" [class.fa-check]="!isSaving"></i>
          </div>
        </button>
      </div>
      
      <div class="bottom-spacer"></div>
    </div>
  </div>
</ion-content>
