<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar color="success">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title color="light">Know Your Area</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="toggleFilters()">
        <ion-icon name="filter-outline" slot="icon-only" color="light"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="beat-content">
  <div id="boundary-map" class="beat-map"></div>

  <!-- ── Map Controls ────────────────────────────────────────────────────── -->
  <div slot="fixed" class="map-controls">
    <button class="map-control-btn" (click)="toggleMapType()">
      <ion-icon [name]="mapType === 'roadmap' ? 'earth-outline' : 'map-outline'"></ion-icon>
    </button>
    <button class="map-control-btn" (click)="showMyLocation()">
      <ion-icon name="locate-outline"></ion-icon>
    </button>
  </div>

  <!-- ── Floating Filter Card ──────────────────────────────────────────────── -->
  <div class="floating-filter-container" [class.is-visible]="showFilters">
    <div class="floating-filter-card">
      <div class="filter-grid">
        <!-- Year Filter -->
        <div class="filter-box">
          <span class="filter-label">Year</span>
          <ion-select [(ngModel)]="selectedYear" (ionChange)="onYearChange()" placeholder="Select Year" class="custom-select" interface="popover" toggleIcon="chevron-down-outline">
            <ion-select-option *ngFor="let item of availableYears" [value]="item.id">
              {{ item.id === 'all' ? ('COMMON.all' | translate) : item.name }}
            </ion-select-option>
          </ion-select>
        </div>

        <!-- Range Filter -->
        <div class="filter-box">
          <span class="filter-label">Select Range</span>
          <ion-select [(ngModel)]="selectedRangeId" (ionChange)="onRangeChange()" placeholder="Select Range" class="custom-select" interface="popover" toggleIcon="chevron-down-outline">
            <ion-select-option *ngFor="let item of ranges" [value]="item.id">{{item.name}}</ion-select-option>
          </ion-select>
        </div>

        <!-- Section Filter -->
        <div class="filter-box" [class.disabled]="!selectedRangeId">
          <span class="filter-label">Select Section</span>
          <ion-select [(ngModel)]="selectedSectionId" (ionChange)="onSectionChange()" placeholder="Select Section" [disabled]="!selectedRangeId" class="custom-select" interface="popover" toggleIcon="chevron-down-outline">
            <ion-select-option *ngFor="let item of sections" [value]="item.id">{{item.name}}</ion-select-option>
          </ion-select>
        </div>

        <!-- Beat Filter -->
        <div class="filter-box" [class.disabled]="!selectedSectionId">
          <span class="filter-label">Select Beat</span>
          <ion-select [(ngModel)]="selectedBeatId" placeholder="Select Beat" [disabled]="!selectedSectionId" class="custom-select" interface="popover" toggleIcon="chevron-down-outline">
            <ion-select-option *ngFor="let item of beats" [value]="item.id">{{item.name}}</ion-select-option>
          </ion-select>
        </div>
      </div>

      <div class="filter-actions">
        <ion-button fill="clear" color="medium" class="reset-btn" (click)="resetFilters()">
          <ion-icon name="refresh-outline" slot="start"></ion-icon>
          RESET
        </ion-button>
        <ion-button fill="solid" color="success" class="apply-btn" (click)="applyFilters()">
          <ion-icon name="checkmark-outline" slot="start"></ion-icon>
          APPLY
        </ion-button>
      </div>
    </div>
  </div>

  <!-- ── Loading Overlay ─────────────────────────────────────────────────── -->
  <div *ngIf="loading" class="state-overlay">
    <div class="state-card">
      <ion-spinner name="crescent" color="success"></ion-spinner>
      <p>Loading...</p>
    </div>
  </div>
</ion-content>

<!-- ── Panel Toggle Button ──────────────────────────────────────────────── -->
<div class="panel-toggle-btn" (click)="togglePanel()" [class.panel-open]="isPanelOpen">
  <ion-icon [name]="isPanelOpen ? 'chevron-forward-outline' : 'chevron-back-outline'"></ion-icon>
</div>

<!-- ── Layer panel (Right Sidebar) ──────────────────────────────────────── -->
<div class="layer-panel" [class.is-open]="isPanelOpen">
  <div class="panel-header">
    <span class="panel-title">Map Layers</span>
    <span class="panel-subtitle">Select to Show/Hide</span>
  </div>

  <div class="layer-list">
    <!-- Dynamic KML Layers -->
    <div *ngFor="let layer of layers" class="layer-row" [class.layer-hidden]="!layer.visible"
      (click)="toggleLayer(layer)">
      <div class="layer-dot" [style.background-color]="layer.color"></div>
      <div class="layer-icon-box" [style.background-color]="layer.lightColor">
        <ion-icon [name]="layer.icon" class="layer-icon" [style.color]="layer.color"></ion-icon>
      </div>
      <div class="layer-content-main">
        <span class="layer-label">
          {{ layer.label }}
        </span>
        <div class="layer-suffix">
          <span class="layer-count-badge">{{ layer.count }}</span>
          <ion-icon [name]="layer.visible ? 'eye' : 'eye-off-outline'" class="eye-toggle-icon"></ion-icon>
        </div>
      </div>
    </div>
  </div>
</div>
